<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>単一換字式暗号＆頻度解析ツール</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
        .box-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        textarea { width: 100%; height: 80px; box-sizing: border-box; }
        .btn-group { margin: 15px 0; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; margin: 0 10px; cursor: pointer; }
        
        /* 頻度解析表示エリアのスタイル */
        .freq-container { display: flex; gap: 20px; margin-top: 20px; }
        .freq-box { flex: 1; border: 1px solid #ccc; padding: 10px; border-radius: 5px; max-height: 250px; overflow-y: auto; background: #f9f9f9; }
        .freq-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .freq-table th, .freq-table td { border-bottom: 1px solid #ddd; text-align: left; padding: 4px; }
        .freq-table th { background: #eee; }
    </style>
</head>
<body>

    <h2>単一換字式暗号ツール（頻度解析機能つき）</h2>

    <div class="box-group">
        <label>変換ルール：元の文字（例: ABCDEFGHIJKLMNOPQRSTUVWXYZ）</label>
        <textarea id="rulePlain">ABCDEFGHIJKLMNOPQRSTUVWXYZ</textarea>
    </div>

    <div class="box-group">
        <label>変換ルール：暗号化された文字（例: QWERTYUIOPASDFGHJKLZXCVBNM）</label>
        <textarea id="ruleCipher">QWERTYUIOPASDFGHJKLZXCVBNM</textarea>
    </div>

    <div class="btn-group">
        <button onclick="processText('encrypt')">暗号化</button>
        <button onclick="processText('decrypt')">復号化</button>
    </div>

    <div class="box-group">
        <label>変換したい文章（入力）</label>
        <textarea id="inputText" placeholder="ここに文章を入力してください"></textarea>
    </div>

    <div class="box-group">
        <label>変換後の文章（出力）</label>
        <textarea id="outputText" readonly></textarea>
    </div>

    <!-- 頻度解析結果エリア -->
    <h3>文字の出現頻度解析 (A-Z)</h3>
    <div class="freq-container">
        <div class="freq-box">
            <strong>入力文章の頻度</strong>
            <table class="freq-table" id="inputFreqTable">
                <thead><tr><th>文字</th><th>件数</th><th>割合</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="freq-box">
            <strong>変換後文章の頻度</strong>
            <table class="freq-table" id="outputFreqTable">
                <thead><tr><th>文字</th><th>件数</th><th>割合</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        function processText(mode) {
            const rulePlain = document.getElementById('rulePlain').value;
            const ruleCipher = document.getElementById('ruleCipher').value;
            const inputText = document.getElementById('inputText').value;

            if (rulePlain.length !== ruleCipher.length) {
                alert('変換ルールの文字数は上下で同じにしてください。');
                return;
            }

            const fromChars = mode === 'encrypt' ? rulePlain : ruleCipher;
            const toChars = mode === 'encrypt' ? ruleCipher : rulePlain;

            // 変換ルールマップの作成（大文字・小文字自動補完）
            const charMap = new Map();
            for (let i = 0; i < fromChars.length; i++) {
                const src = fromChars[i];
                const dst = toChars[i];

                charMap.set(src, dst);

                if (src >= 'A' && src <= 'Z') {
                    charMap.set(src.toLowerCase(), dst.toLowerCase());
                } else if (src >= 'a' && src <= 'z') {
                    charMap.set(src.toUpperCase(), dst.toUpperCase());
                }
            }

            // 置換処理
            const outputText = Array.from(inputText).map(char => {
                return charMap.has(char) ? charMap.get(char) : char;
            }).join('');

            document.getElementById('outputText').value = outputText;

            // 頻度解析の実行
            analyzeFrequency(inputText, 'inputFreqTable');
            analyzeFrequency(outputText, 'outputFreqTable');
        }

        // アルファベット（A-Z）の出現頻度を計算してテーブルに出力する関数
        function analyzeFrequency(text, tableId) {
            const counts = {};
            let totalAlphabet = 0;

            // 大文字・小文字を区別せずカウント（A-Z）
            const cleanText = text.toUpperCase();

            for (let char of cleanText) {
                if (char >= 'A' && char <= 'Z') {
                    counts[char] = (counts[char] || 0) + 1;
                    totalAlphabet++;
                }
            }

            // 件数の多い順にソート
            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

            // テーブル表示の更新
            const tbody = document.getElementById(tableId).querySelector('tbody');
            tbody.innerHTML = '';

            if (totalAlphabet === 0) {
                tbody.innerHTML = '<tr><td colspan="3">対象文字なし</td></tr>';
                return;
            }

            sorted.forEach(([char, count]) => {
                const percent = ((count / totalAlphabet) * 100).toFixed(1);
                const row = `<tr><td><strong>${char}</strong></td><td>${count}</td><td>${percent}%</td></tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }
    </script>

</body>
</html>
